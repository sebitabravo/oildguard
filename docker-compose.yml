services:
  influxdb:
    image: influxdb:2.7.6
    container_name: oilguard-influxdb
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: oilguard
      DOCKER_INFLUXDB_INIT_PASSWORD: ${DOCKER_INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: oilguard
      DOCKER_INFLUXDB_INIT_BUCKET: oilguard
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  mqtt:
    image: eclipse-mosquitto:2.0.18
    container_name: oilguard-mqtt
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:8883:8883"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/certs:/mosquitto/certs:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      # Broker is up when it accepts a publish on localhost.
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t oilguard/health -m ok -q 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: oilguard-backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      influxdb:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: oilguard
      INFLUXDB_BUCKET: oilguard
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      MQTT_HOST: mqtt
      OILGUARD_MQTT_CA: ${OILGUARD_MQTT_CA:-}
      OILGUARD_MQTT_CLIENT_CERT: ${OILGUARD_MQTT_CLIENT_CERT:-}
      OILGUARD_MQTT_CLIENT_KEY: ${OILGUARD_MQTT_CLIENT_KEY:-}
      MQTT_TOPIC: oilguard/signals
      BACKEND_URL: http://backend:8000
      OILGUARD_DEVICE_KEYS: ${OILGUARD_DEVICE_KEYS:-}
      OILGUARD_REQUIRE_SIGNATURE: ${OILGUARD_REQUIRE_SIGNATURE:-0}
      OILGUARD_DEVICE_MASTER_KEY: ${OILGUARD_DEVICE_MASTER_KEY:-}
      OILGUARD_INFLUX_WRITE: ${OILGUARD_INFLUX_WRITE:-1}
    healthcheck:
      # stdlib-only probe (python:3.11-slim has no curl).
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build: ./frontend
    container_name: oilguard-frontend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      # Bind mount so the dev server serves live source instead of the frozen
      # COPY baked in at build time. The anonymous volume preserves the image's
      # node_modules, so dependencies stay image-managed rather than host-managed.
      - ./frontend:/app
      # La colección de docs del sitio lee ../docs (raíz del repo) desde /app.
      - ./docs:/docs:ro
      - /app/node_modules
    depends_on:
      - backend
    environment:
      PUBLIC_BACKEND_URL: http://localhost:8000

  edge-sim:
    # Simulador de borde en Rust para pruebas de carga; no arranca con el stack
    # normal (perfil "sim"): docker compose --profile sim up edge-sim
    profiles: ["sim"]
    build: ./edge-sim
    container_name: oilguard-edge-sim
    volumes:
      - ./mosquitto/certs:/mosquitto/certs:ro
    depends_on:
      mqtt:
        condition: service_healthy
    environment:
      OILGUARD_DEVICE_MASTER_KEY: ${OILGUARD_DEVICE_MASTER_KEY:-}
      OILGUARD_MQTT_CA: ${OILGUARD_MQTT_CA:-}
      OILGUARD_MQTT_CLIENT_CERT: ${OILGUARD_MQTT_CLIENT_CERT:-}
      OILGUARD_MQTT_CLIENT_KEY: ${OILGUARD_MQTT_CLIENT_KEY:-}
    command:
      - --devices
      - ${EDGE_SIM_DEVICES:-100}
      - --rate-hz
      - "10"
      - --mode
      - realtime
      - --mqtt-url
      - ${EDGE_SIM_MQTT_URL:-mqtt://mqtt:1883}
      - --stats-interval
      - "10"

volumes:
  influxdb-data:
