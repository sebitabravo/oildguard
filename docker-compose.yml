services:
  influxdb:
    image: influxdb:2.7.6
    container_name: oilguard-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: oilguard
      DOCKER_INFLUXDB_INIT_PASSWORD: oilguard-local-demo
      DOCKER_INFLUXDB_INIT_ORG: oilguard
      DOCKER_INFLUXDB_INIT_BUCKET: oilguard
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: oilguard-local-admin-token

  mqtt:
    image: eclipse-mosquitto:2.0.18
    container_name: oilguard-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  backend:
    build: ./backend
    container_name: oilguard-backend
    ports:
      - "8000:8000"
    depends_on:
      - influxdb
      - mqtt
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: oilguard
      INFLUXDB_BUCKET: oilguard
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"

  frontend:
    build: ./frontend
    container_name: oilguard-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  influxdb-data:
