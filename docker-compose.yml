services:
  influxdb:
    image: influxdb:2.7.6
    container_name: oilguard-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: oilguard
      DOCKER_INFLUXDB_INIT_PASSWORD: oilguard-local-demo
      DOCKER_INFLUXDB_INIT_ORG: oilguard
      DOCKER_INFLUXDB_INIT_BUCKET: oilguard
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: oilguard-local-admin-token
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  mqtt:
    image: eclipse-mosquitto:2.0.18
    container_name: oilguard-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      # Broker is up when it accepts a publish on localhost.
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t oilguard/health -m ok -q 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  backend:
    build: ./backend
    container_name: oilguard-backend
    ports:
      - "8000:8000"
    depends_on:
      influxdb:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: oilguard
      INFLUXDB_BUCKET: oilguard
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-oilguard-local-admin-token}
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_TOPIC: oilguard/signals
      BACKEND_URL: http://backend:8000
    healthcheck:
      # stdlib-only probe (python:3.11-slim has no curl).
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build: ./frontend
    container_name: oilguard-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: http://localhost:8000

volumes:
  influxdb-data:
