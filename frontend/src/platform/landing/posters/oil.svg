<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">Settling-window pressure study for oil condition</title>
<desc id="desc">Static poster: modelled pressure relaxation curve settling toward a fitted steady level inside a rest window.</desc>
<rect width="800" height="450" fill="#0B0F14"/>
<rect x="16" y="16" width="768" height="418" fill="none" stroke="#334155" stroke-width="1"/>
<text x="40" y="52" font-family="JetBrains Mono, monospace" font-size="15" letter-spacing="2" fill="#E2E8F0">OIL CONDITION · SETTLING STUDY</text>
<text x="40" y="74" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#8A94A6">STATIC POSTER · 3D LOADS IN VIEW</text>
<rect x="90" y="120" width="440" height="220" fill="#111720" stroke="#334155"/>
<rect x="330" y="120" width="200" height="220" fill="#F59E0B" opacity="0.08"/>
<line x1="90" y1="280" x2="530" y2="280" stroke="#F59E0B" stroke-width="1" stroke-dasharray="6 4"/>
<path d="M100 150 C 200 160, 260 210, 330 250 S 460 275, 520 278" fill="none" stroke="#E2E8F0" stroke-width="2"/>
<line x1="330" y1="120" x2="330" y2="340" stroke="#475569" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="90" y1="340" x2="530" y2="340" stroke="#475569" stroke-width="1"/>
<g font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1" fill="#8A94A6">
<text x="100" y="136">STOP</text>
<text x="336" y="136">SETTLING WINDOW</text>
<text x="540" y="284">FITTED LEVEL</text>
<text x="90" y="362">SINCE STOP</text>
</g>
<g font-family="JetBrains Mono, monospace" font-size="13" fill="#E2E8F0">
<text x="570" y="170">PRESSURE</text>
<text x="570" y="196">RELAXATION</text>
<text x="570" y="240" fill="#8A94A6" font-size="11">REST NARROWS</text>
<text x="570" y="258" fill="#8A94A6" font-size="11">THE BAND</text>
</g>
<text x="90" y="410" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#F59E0B">SYNTHETIC-PROXY · NOT A BENCH RESULT</text>
</svg>
