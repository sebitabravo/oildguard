<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
<title id="title">Estudio de presión en ventana de asentamiento del aceite</title>
<desc id="desc">Póster estático: curva modelada de relajación de presión hacia un nivel estable ajustado dentro de una ventana de reposo.</desc>
<rect width="800" height="450" fill="#0B0F14"/>
<rect x="16" y="16" width="768" height="418" fill="none" stroke="#334155" stroke-width="1"/>
<text x="40" y="52" font-family="JetBrains Mono, monospace" font-size="15" letter-spacing="2" fill="#E2E8F0">CONDICIÓN DEL ACEITE · ESTUDIO DE ASENTAMIENTO</text>
<text x="40" y="74" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#8A94A6">PÓSTER ESTÁTICO · 3D SE ACTIVA EN VISTA</text>
<rect x="90" y="120" width="440" height="220" fill="#111720" stroke="#334155"/>
<rect x="330" y="120" width="200" height="220" fill="#F59E0B" opacity="0.08"/>
<line x1="90" y1="280" x2="530" y2="280" stroke="#F59E0B" stroke-width="1" stroke-dasharray="6 4"/>
<path d="M100 150 C 200 160, 260 210, 330 250 S 460 275, 520 278" fill="none" stroke="#E2E8F0" stroke-width="2"/>
<line x1="330" y1="120" x2="330" y2="340" stroke="#475569" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="90" y1="340" x2="530" y2="340" stroke="#475569" stroke-width="1"/>
<g font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1" fill="#8A94A6">
<text x="100" y="136">PARADA</text>
<text x="336" y="136">VENTANA DE ASENTAMIENTO</text>
<text x="540" y="284">NIVEL AJUSTADO</text>
<text x="90" y="362">DESDE LA PARADA</text>
</g>
<g font-family="JetBrains Mono, monospace" font-size="13" fill="#E2E8F0">
<text x="570" y="170">PRESIÓN</text>
<text x="570" y="196">RELAJACIÓN</text>
<text x="570" y="240" fill="#8A94A6" font-size="11">EL REPOSO REDUCE</text>
<text x="570" y="258" fill="#8A94A6" font-size="11">LA BANDA</text>
</g>
<text x="90" y="410" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="2" fill="#F59E0B">SUSTITUTO SINTÉTICO · NO ES RESULTADO DE BANCO</text>
</svg>
